name: CI Pipeline

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check app tests

      - name: Run Pytest
        run: |
          cd backend
          pytest

      - name: Verify Alembic Configuration
        run: |
          cd backend
          DATABASE_URL="sqlite+aiosqlite:///:memory:" alembic check

  frontend-checks:
    name: Frontend Lint, Types & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run type-check

      - name: ESLint Check
        run: npm run lint

      - name: Production Build
        run: npm run build

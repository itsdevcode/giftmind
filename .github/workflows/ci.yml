name: CI Pipeline

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  backend-checks:
    name: Backend Tests & Lint (with PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: giftmind
          POSTGRES_PASSWORD: giftmind_test_password
          POSTGRES_DB: giftmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Format Check
        run: |
          cd backend
          ruff format --check app tests

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check app tests

      - name: Run Pytest (PostgreSQL Integration)
        env:
          DATABASE_URL: postgresql+asyncpg://giftmind:giftmind_test_password@localhost:5432/giftmind_test
        run: |
          cd backend
          pytest

      - name: Verify Alembic Migration Against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://giftmind:giftmind_test_password@localhost:5432/giftmind_test
        run: |
          cd backend
          alembic check

  frontend-checks:
    name: Frontend Lint, Types & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run type-check

      - name: ESLint Check
        run: npm run lint

      - name: Production Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production Build
        run: npm run build
